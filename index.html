      return (

            </div>
            <button onClick={function () { setVoice(!voice); }} className={'flex items-center gap-2 px-3 py-2 rounded-lg border text-sm font-semibold ' + (voice ? 'border-emerald-500/40 text-emerald-400 bg-emerald-500/10' : 'border-slate-700 text-slate-400')}>

              <Icon name="volume" size={18} className="animate-pulse" />

          <Card className={flash === 'err' ? 'border-red-500 bg-red-500/10' : flash === 'ok' ? 'border-emerald-500' : ''}>
            <div className="text-center">

                <Badge tone="amber">{task.temp}</Badge>
                <Badge tone={task.weight.indexOf('Pesado') >= 0 ? 'red' : 'slate'}>{task.weight}</Badge>
              </div>
              <div className="bg-slate-800 rounded-xl p-4 mb-4">
                <div className="text-2xl font-bold text-white">{task.desc}</div>
                <div className="text-slate-400 mt-1">SKU: <span className="font-mono text-sky-400">{task.sku}</span></div>
                <div className="text-5xl font-black text-emerald-400 mt-2">×{task.qty}</div>
              </div>

              <div className="flex items-center justify-center gap-1 mb-4 flex-wrap">
                {PHASES.map(function (p, i) {
                  return (
                    <div key={i} className={'flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold ' + (i < ph ? 'bg-emerald-500/20 text-emerald-400' : i === ph ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40' : 'bg-slate-800 text-slate-500')}>
                      {i < ph ? <Icon name="check" size={12} /> : <Icon name={p.icon} size={12} />} {p.label}
                    </div>
                  );

              </div>

              {flash === 'err' && (
                <div className="mb-4 bg-red-600 text-white rounded-xl py-3 font-bold text-lg flex items-center justify-center gap-2">

              {phase.scan ? (
                <div className="grid grid-cols-2 gap-3">

                    <Icon name="x" size={26} /> Escaneo erróneo

                  <Icon name="chevron" size={26} /> Completar: {phase.label}
                </button>
              )}
            </div>
          </Card>

          <div className="grid grid-cols-4 gap-3">
            {[['Desplaz.', times.despl], ['Búsqueda', times.busq], ['Escaneo', times.esc], ['Depósito', times.dep]].map(function (p) {
              return (
                <div key={p[0]} className="bg-slate-900/70 border border-slate-800 rounded-xl p-3 text-center">
                  <div className="text-xl font-bold text-white">{p[1]}s</div>
                  <div className="text-xs text-slate-500">{p[0]}</div>
                </div>
              );
            })}
          </div>

          <Card>
            <div className="text-xs text-slate-400 uppercase tracking-wider mb-2">Reporte rápido de incidencia (sin detener el flujo)</div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
              {['Rotura de stock', 'Producto dañado', 'Ubicación incorrecta', 'Equipo averiado'].map(function (t) {
                return (
                  <button key={t} className="py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 font-semibold text-sm hover:bg-red-500/20 flex items-center justify-center gap-2">
                    <Icon name="alert" size={15} /> {t}
                  </button>
                );
              })}
            </div>
          </Card>

          <div className={'text-center text-sm font-semibold rounded-xl py-2 ' + (online ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400')}>
            {online
              ? <span><Icon name="wifi" size={14} className="inline" /> Conectado — los tiempos de ciclo se envían al WMS en caliente</span>
              : <span><Icon name="wifioff" size={14} className="inline" /> Modo OFFLINE — datos registrados en caché local (SQLite) y sincronización automática al recuperar cobertura</span>}
          </div>
        </div>
      );
    }

    /* ============ ENRUTAMIENTO ============ */
    function RoutesView() {

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <Card className="lg:col-span-2">
              <h3 className="text-white font-semibold mb-3 flex items-center gap-2"><Icon name="warehouse" size={18} className="text-emerald-400" /> Mapa del almacén — ruta calculada</h3>

    /* ============ SIMULADOR DE CAMPAÑAS ============ */
    var CAMP_WEEKS = ['S44', 'S45', 'S46', 'S47', 'S48·BF', 'S49', 'S50', 'S51', 'S52·Nav', 'E01'];
    var FACTORS = [1.1, 1.2, 1.25, 1.4, 2.6, 2.1, 2.3, 2.7, 3.0, 1.9];

    function CampaignSim() {
      var s1 = useState(2.2), growth = s1[0], setGrowth = s1[1];
      var s2 = useState(18), ops = s2[0], setOps = s2[1];
      var s3 = useState(7.5), shift = s3[0], setShift = s3[1];
      var s4 = useState(true), auto = s4[0], setAuto = s4[1];

      var base = 12000, lph = 142;
      var effLph = lph * (auto ? 1.25 : 1);
      var demand = Math.round(base * growth);
      var capacity = Math.round(ops * effLph * shift);
      var ratio = capacity / demand;
      var reqOps = Math.ceil(demand / (effLph * shift));
      var status = ratio >= 1.05 ? 'ok' : ratio >= 0.95 ? 'warn' : 'bad';
      var chartData = FACTORS.map(function (f, i) { return { w: CAMP_WEEKS[i], demanda: Math.round(base * f), capacidad: capacity }; });

      var recs = [];
      if (ratio < 1) recs.push('Incorporar ' + Math.max(reqOps - ops, 1) + ' operarios temporales (ETT) para cubrir el pico');
      if (ratio < 1.05) recs.push('Ampliar turno +1 h en semanas pico (S48 y S52)');
      if (!auto) recs.push('Activar Voice-Picking / Pick-to-Light: +25% LPH estimado');
      recs.push('Reubicar top-50 SKUs de campaña a zonas doradas (pasillos 1–4)');
      if (growth >= 2.5) recs.push('Pre-lanzar olas nocturnas y batching por zona frío/congelado');
      recs.push('Refuerzo de reposición 2 h antes del pico de cut-off');

      return (
        <div className="space-y-6">
          <div className={'rounded-2xl border p-4 flex items-center gap-4 ' + (status === 'ok' ? 'bg-emerald-500/10 border-emerald-500/40' : status === 'warn' ? 'bg-amber-500/10 border-amber-500/40' : 'bg-red-500/10 border-red-500/40')}>
            <Icon name={status === 'ok' ? 'check' : 'alert'} size={28} className={status === 'ok' ? 'text-emerald-400' : status === 'warn' ? 'text-amber-400' : 'text-red-400'} />
            <div>
              <div className={'font-black text-lg ' + (status === 'ok' ? 'text-emerald-400' : status === 'warn' ? 'text-amber-400' : 'text-red-400')}>
                {status === 'ok' ? 'CAPACIDAD SUFICIENTE' : status === 'warn' ? 'CAPACIDAD JUSTA — riesgo en picos' : 'DÉFICIT DE CAPACIDAD — plan de choque necesario'}
              </div>
              <div className="text-sm text-slate-400">Ratio capacidad/demanda: {Math.round(ratio * 100)}% · Escenario: campaña ×{growth.toFixed(1)} sobre base diaria</div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <StatCard icon="calendar" label="Demanda pico" value={demand.toLocaleString('es')} sub="líneas/día en campaña" tone="amber" />
            <StatCard icon="users" label="Capacidad actual" value={capacity.toLocaleString('es')} sub={ops + ' operarios × ' + shift + ' h × ' + Math.round(effLph) + ' LPH'} tone="sky" />
            <StatCard icon="zap" label="Operarios necesarios" value={String(reqOps)} sub={reqOps > ops ? '+' + (reqOps - ops) + ' temporales' : (ops - reqOps) + ' de holgura'} tone={reqOps > ops ? 'red' : 'emerald'} />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <Card>
              <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="gauge" size={18} className="text-emerald-400" /> Parámetros de campaña</h3>
              <Slider label="Multiplicador de demanda" value={growth} min={1} max={4} step={0.1} onChange={setGrowth} unit="×" />
              <Slider label="Operarios disponibles" value={ops} min={8} max={40} step={1} onChange={setOps} unit="" />
              <Slider label="Horas de turno" value={shift} min={6} max={12} step={0.5} onChange={setShift} unit=" h" />
              <button onClick={function () { setAuto(!auto); }} className={'w-full mt-2 py-3 rounded-xl font-bold text-sm border ' + (auto ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-300 border-slate-700')}>
                <Icon name="zap" size={14} className="inline mr-1" /> Voice / Pick-to-Light: {auto ? 'ACTIVO (+25% LPH)' : 'INACTIVO'}
              </button>
              <p className="text-xs text-slate-500 mt-3">Base diaria normal: 12.000 líneas · LPH estándar 142.</p>
            </Card>

            <Card className="lg:col-span-2">
              <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="trend" size={18} className="text-sky-400" /> Demanda vs. capacidad (Nov — Ene)</h3>
              <div className="h-64">
                <ResponsiveContainer>
                  <LineChart data={chartData}>
                    <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" />
                    <XAxis dataKey="w" stroke="#64748b" fontSize={11} />
                    <YAxis stroke="#64748b" fontSize={11} />
                    <Tooltip contentStyle={tooltipStyle} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                    <Line type="monotone" dataKey="demanda" name="Demanda (líneas/día)" stroke="#f59e0b" strokeWidth={3} dot={{ r: 3 }} />
                    <Line type="monotone" dataKey="capacidad" name="Capacidad configurada" stroke="#10b981" strokeWidth={2} strokeDasharray="6 4" dot={false} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </Card>
          </div>

          <Card>
            <h3 className="text-white font-semibold mb-3 flex items-center gap-2"><Icon name="zap" size={18} className="text-amber-400" /> Plan de choque recomendado</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
              {recs.map(function (r, i) {
                return (
                  <div key={i} className="flex items-start gap-2 bg-slate-800/60 rounded-xl p-3 border border-slate-700 text-sm text-slate-200">
                    <Icon name="check" size={16} className="text-emerald-400 mt-0.5 shrink-0" /> {r}
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      );
    }

    /* ============ PLANIFICADOR DE OLAS ============ */
    function WavePlanner() {
      var s1 = useState(['ORD-88421', 'ORD-88424']), sel = s1[0], setSel = s1[1];
      var s2 = useState('Cutoff'), crit = s2[0], setCrit = s2[1];
      var s3 = useState(2), opsPerWave = s3[0], setOpsPerWave = s3[1];
      var s4 = useState([]), waves = s4[0], setWaves = s4[1];
      var effLph = 177.5;

      function toggle(id) {
        if (sel.indexOf(id) >= 0) setSel(sel.filter(function (x) { return x !== id; }));
        else setSel(sel.concat([id]));
      }

      var selected = PENDING_ORDERS.filter(function (o) { return sel.indexOf(o.id) >= 0; });
      var totLines = selected.reduce(function (a, o) { return a + o.lineas; }, 0);
      var totUnits = selected.reduce(function (a, o) { return a + o.und; }, 0);
      var estMin = Math.max(5, Math.round((totLines / (effLph * opsPerWave)) * 60));

      function generate() {
        if (!selected.length) return;
        var w = {
          id: 'WAVE-' + (43 + waves.length), orders: selected.map(function (o) { return o.id; }),
          lineas: totLines, und: totUnits, crit: crit, ops: opsPerWave, estMin: estMin,
          dist: Math.round(totLines * 21 / opsPerWave), estado: 'Borrador', prog: 0
        };
        setWaves([w].concat(waves));
        setSel([]);
      }

      function launch(id) {
        setWaves(waves.map(function (w) { return w.id === id ? { id: w.id, orders: w.orders, lineas: w.lineas, und: w.und, crit: w.crit, ops: w.ops, estMin: w.estMin, dist: w.dist, estado: 'Lanzada', prog: 12 } : w; }));
      }

      function minCut(orderIds) {
        var best = 24;
        orderIds.forEach(function (id) {
          var o = PENDING_ORDERS.find(function (x) { return x.id === id; });
          if (o) {
            var parts = o.cutoff.split(':');
            var v = parseInt(parts[0], 10) + parseInt(parts[1], 10) / 60;
            if (v < best) best = v;
          }
        });
        var hh = Math.floor(best), mm = Math.round((best - hh) * 60);
        return (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
      }

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <Card className="lg:col-span-2">
              <h3 className="text-white font-semibold mb-3 flex items-center gap-2"><Icon name="waves" size={18} className="text-sky-400" /> Pedidos pendientes — seleccionar para agrupar</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-slate-400 border-b border-slate-800">
                      <th className="py-2"></th><th className="py-2 pr-3">Pedido</th><th className="py-2 pr-3">Cliente</th>
                      <th className="py-2 pr-3">Líneas</th><th className="py-2 pr-3">Zona</th><th className="py-2 pr-3">Temp.</th>
                      <th className="py-2 pr-3">Cut-off</th><th className="py-2">Prioridad</th>
                    </tr>
                  </thead>
                  <tbody>
                    {PENDING_ORDERS.map(function (o) {
                      var on = sel.indexOf(o.id) >= 0;
                      return (
                        <tr key={o.id} onClick={function () { toggle(o.id); }} className={'border-b border-slate-800/60 cursor-pointer ' + (on ? 'bg-emerald-500/5' : '')}>
                          <td className="py-2 pr-2">
                            <span className={'inline-flex items-center justify-center w-5 h-5 rounded-md border ' + (on ? 'bg-emerald-600 border-emerald-500 text-white' : 'border-slate-600')}>
                              {on && <Icon name="check" size={14} />}
                            </span>
                          </td>
                          <td className="py-2 pr-3 font-mono text-sky-400">{o.id}</td>
                          <td className="py-2 pr-3 text-slate-200">{o.cliente}</td>
                          <td className="py-2 pr-3 text-white font-bold">{o.lineas}</td>
                          <td className="py-2 pr-3"><Badge tone={o.zona === 'Pesado' ? 'red' : (o.zona === 'Frío' || o.zona === 'Congelado') ? 'sky' : 'slate'}>{o.zona}</Badge></td>
                          <td className="py-2 pr-3 text-slate-400">{o.temp}</td>
                          <td className="py-2 pr-3 font-semibold">{o.cutoff}</td>
                          <td className="py-2"><Badge tone={o.prio === 'Alta' ? 'red' : o.prio === 'Media' ? 'amber' : 'slate'}>{o.prio}</Badge></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </Card>

            <Card>
              <h3 className="text-white font-semibold mb-3 flex items-center gap-2"><Icon name="cpu" size={18} className="text-emerald-400" /> Criterio de agrupación</h3>
              <div className="flex flex-wrap gap-2 mb-4">
                {['Cutoff', 'Zona', 'Temperatura', 'Ruta', 'Cliente'].map(function (c) {
                  return (
                    <button key={c} onClick={function () { setCrit(c); }} className={'px-3 py-1.5 rounded-lg text-xs font-bold border ' + (crit === c ? 'bg-sky-600 text-white border-sky-500' : 'bg-slate-800 text-slate-300 border-slate-700')}>{c}</button>
                  );
                })}
              </div>
              <Slider label="Operarios asignados a la ola" value={opsPerWave} min={1} max={6} step={1} onChange={setOpsPerWave} unit="" />
              <div className="bg-slate-800/60 rounded-xl p-4 border border-slate-700 space-y-1.5 text-sm mb-4">
                <div className="flex justify-between text-slate-300"><span>Pedidos seleccionados</span><span className="font-bold text-white">{selected.length}</span></div>
                <div className="flex justify-between text-slate-300"><span>Líneas totales</span><span className="font-bold text-white">{totLines}</span></div>
                <div className="flex justify-between text-slate-300"><span>Unidades totales</span><span className="font-bold text-white">{totUnits}</span></div>
                <div className="flex justify-between text-slate-300"><span>Duración estimada</span><span className="font-bold text-emerald-400">{estMin} min</span></div>
              </div>
              <button onClick={generate} disabled={!selected.length} className="w-full py-3 rounded-xl bg-emerald-600 disabled:opacity-40 hover:bg-emerald-500 text-white font-black flex items-center justify-center gap-2">
                <Icon name="waves" size={18} /> Generar ola
              </button>
            </Card>
          </div>

          <Card>
            <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="layers" size={18} className="text-amber-400" /> Olas del turno</h3>
            {!waves.length && <p className="text-slate-500 text-sm">No hay olas generadas. Selecciona pedidos y pulsa «Generar ola».</p>}
            <div className="space-y-3">
              {waves.map(function (w) {
                return (
                  <div key={w.id} className="bg-slate-800/60 border border-slate-700 rounded-xl p-4">
                    <div className="flex flex-wrap items-center gap-3 mb-2">
                      <span className="font-mono font-black text-white">{w.id}</span>
                      <Badge tone={w.estado === 'Lanzada' ? 'emerald' : 'slate'}>{w.estado}</Badge>
                      <Badge tone="sky">{w.crit}</Badge>
                      <span className="text-xs text-slate-400">{w.orders.length} pedidos · {w.lineas} líneas · {w.und} und · {w.ops} operarios · {w.dist} m</span>
                      {w.estado === 'Borrador' && (
                        <button onClick={function () { launch(w.id); }} className="ml-auto px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold flex items-center gap-1">
                          <Icon name="play" size={12} /> Lanzar
                        </button>
                      )}
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-3 overflow-hidden">
                      <div className="h-3 rounded-full bg-emerald-500 transition-all" style={{ width: w.prog + '%' }} />
                    </div>
                    <div className="text-xs text-slate-500 mt-1">Duración estimada: {w.estMin} min · Cut-off más exigente: {minCut(w.orders)}</div>
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      );
    }

    /* ============ INDUCCIÓN / FORMACIÓN ============ */
    function Induction() {
      var s1 = useState(0), cur = s1[0], setCur = s1[1];
      var s2 = useState([]), doneMods = s2[0], setDoneMods = s2[1];
      var s3 = useState(false), practiceOK = s3[0], setPracticeOK = s3[1];
      var s4 = useState(null), msg = s4[0], setMsg = s4[1];

      var mod = TRAIN_MODULES[cur];
      var progress = Math.round((doneMods.length / TRAIN_MODULES.length) * 100);
      var certified = doneMods.length === TRAIN_MODULES.length;

      function complete() {
        if (mod.practice && !practiceOK) return;
        if (doneMods.indexOf(cur) < 0) setDoneMods(doneMods.concat([cur]));
        setPracticeOK(false); setMsg(null);
        if (cur < TRAIN_MODULES.length - 1) setCur(cur + 1);
      }

      if (certified) {
        return (
          <div className="max-w-2xl mx-auto">
            <Card className="text-center py-12 border-amber-500/40">
              <Icon name="award" size={72} className="mx-auto text-amber-400 mb-4" />
              <h2 className="text-3xl font-black text-white mb-2">¡Operario certificado!</h2>
              <p className="text-slate-400 mb-6">Superados los {TRAIN_MODULES.length} módulos de inducción TRAZA//CO2 con validación práctica de doble escaneo.</p>
              <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700 mb-6 text-left">
                <div className="text-xs uppercase tracking-widest text-slate-500 mb-2">Certificado de inducción</div>
                <div className="text-xl font-bold text-white">Operario en formación · Almacén MAD-01</div>
                <div className="text-sm text-slate-400 mt-1">Fecha: 19/10/2026 · Validez: 12 meses · Ref. TRZ-IND-2026-0142</div>
                <div className="text-xs text-slate-500 mt-2">Firma supervisor: ______________________</div>
              </div>
              <button onClick={function () { setCur(0); setDoneMods([]); setPracticeOK(false); setMsg(null); }} className="px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold">
                Reiniciar formación
              </button>
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <Card>
            <div className="flex items-center justify-between mb-2">
              <h3 className="text-white font-semibold flex items-center gap-2"><Icon name="grad" size={18} className="text-amber-400" /> Progreso de inducción</h3>
              <span className="text-sm font-bold text-amber-400">{doneMods.length}/{TRAIN_MODULES.length}</span>
            </div>
            <div className="w-full bg-slate-800 rounded-full h-4 overflow-hidden">
              <div className="h-4 rounded-full bg-gradient-to-r from-amber-500 to-emerald-500 transition-all" style={{ width: progress + '%' }} />
            </div>
          </Card>

          <div className="flex gap-2 overflow-x-auto pb-1">
            {TRAIN_MODULES.map(function (m, i) {
              return (
                <button key={i} onClick={function () { setCur(i); setMsg(null); }}
                  className={'flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap border ' + (doneMods.indexOf(i) >= 0 ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400' : i === cur ? 'bg-sky-600 border-sky-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400')}>
                  {doneMods.indexOf(i) >= 0 ? <Icon name="check" size={13} /> : <Icon name={m.icon} size={13} />} {i + 1}. {m.t}
                </button>
              );
            })}
          </div>

          <Card>
            <div className="flex items-center gap-3 mb-3">
              <div className="p-3 rounded-xl bg-sky-500/15 border border-sky-500/30"><Icon name={mod.icon} size={22} className="text-sky-400" /></div>
              <div>
                <div className="text-xs text-slate-500 uppercase tracking-wider">Módulo {cur + 1} de {TRAIN_MODULES.length}</div>
                <h3 className="text-xl font-bold text-white">{mod.t}</h3>
              </div>
            </div>
            <p className="text-slate-300 mb-4">{mod.desc}</p>
            <div className="space-y-2 mb-5">
              {mod.pts.map(function (p, i) {
                return (
                  <div key={i} className="flex items-center gap-2 text-sm text-slate-200 bg-slate-800/60 rounded-lg px-3 py-2 border border-slate-700">
                    <Icon name="check" size={15} className="text-emerald-400 shrink-0" /> {p}
                  </div>
                );
              })}
            </div>

            {mod.practice && (
              <div className="bg-slate-800/60 border border-slate-700 rounded-xl p-4 mb-4">
                <div className="text-sm font-bold text-white mb-2 flex items-center gap-2"><Icon name="qr" size={15} className="text-sky-400" /> Práctica obligatoria: doble escaneo</div>
                <p className="text-xs text-slate-400 mb-3">El sistema ha presentado <span className="font-mono text-sky-400">SKU-9921-A</span> en <span className="font-mono text-white">B-04-07</span>. Un operario ha escaneado un producto similar de la misma estantería. ¿Qué validez aplicas?</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <button onClick={function () { setPracticeOK(true); setMsg('ok'); }} className="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold">Validar solo si SKU exacto ✓</button>
                  <button onClick={function () { setMsg('err'); }} className="py-3 rounded-xl bg-red-600/70 hover:bg-red-600 text-white font-bold">Aceptar producto similar ✗</button>
                </div>
                {msg === 'err' && <div className="mt-3 text-red-400 text-sm font-bold bg-red-500/10 border border-red-500/30 rounded-lg p-2">Incorrecto: un SKU similar NO es válido. Bloqueo de línea y re-escaneo obligatorio.</div>}
                {msg === 'ok' && practiceOK && <div className="mt-3 text-emerald-400 text-sm font-bold bg-emerald-500/10 border border-emerald-500/30 rounded-lg p-2">¡Correcto! Error cero = validación exacta de producto + ubicación.</div>}
              </div>
            )}

            <button onClick={complete} disabled={mod.practice && !practiceOK}
              className="w-full py-4 rounded-xl bg-emerald-600 disabled:opacity-40 hover:bg-emerald-500 text-white text-lg font-black flex items-center justify-center gap-2">
              {mod.practice && !practiceOK ? 'Completa la práctica para continuar' : <span>Completar módulo <Icon name="arrow" size={20} /></span>}
            </button>
          </Card>
        </div>
      );
    }

    /* ============ KPIs ============ */
    function KPIs() {
      function stTone(st) { return st === 'ok' ? 'emerald' : st === 'warn' ? 'amber' : 'red'; }
      function Gauge(props) {
        return (
          <Card className="text-center">
            <div className="text-xs uppercase tracking-wider text-slate-400 mb-2">{props.label}</div>
            <div className="h-36">
              <ResponsiveContainer>
                <RadialBarChart innerRadius="70%" outerRadius="100%" data={[{ value: props.value, fill: props.color }]} startAngle={90} endAngle={-270}>
                  <PolarAngleAxis type="number" domain={[0, 100]} tick={false} />
                  <RadialBar dataKey="value" cornerRadius={12} background={{ fill: '#1e293b' }} />
                </RadialBarChart>
              </ResponsiveContainer>
            </div>
            <div className="text-2xl font-black -mt-24 relative" style={{ color: props.color }}>{props.text}</div>
            <div className="h-10" />
          </Card>

        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <Gauge label="Precisión de picking" value={99.4} color="#10b981" text="99,4%" />
            <Gauge label="Utilización de operario" value={68} color="#0ea5e9" text="68%" />
            <Gauge label="Perfect Order Rate" value={97.2} color="#f59e0b" text="97,2%" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card>
              <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="clock" size={18} className="text-amber-400" /> Desglose del tiempo de ciclo (s/línea)</h3>
              <div className="h-64">
                <ResponsiveContainer>
                  <BarChart data={CYCLE_DATA}>
                    <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" />
                    <XAxis dataKey="h" stroke="#64748b" fontSize={12} />
                    <YAxis stroke="#64748b" fontSize={12} />
                    <Tooltip contentStyle={tooltipStyle} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                    <Bar dataKey="despl" stackId="a" name="Desplazamiento" fill="#0ea5e9" />
                    <Bar dataKey="busq" stackId="a" name="Búsqueda" fill="#f59e0b" />
                    <Bar dataKey="esc" stackId="a" name="Escaneo" fill="#8b5cf6" />
                    <Bar dataKey="emb" stackId="a" name="Depósito/Embalaje" fill="#10b981" radius={[4, 4, 0, 0]} />
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </Card>
            <Card>
              <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="target" size={18} className="text-emerald-400" /> LPH real vs. objetivo</h3>
              <div className="h-64">
                <ResponsiveContainer>
                  <LineChart data={LPH_DATA}>
                    <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" />
                    <XAxis dataKey="h" stroke="#64748b" fontSize={12} />
                    <YAxis stroke="#64748b" fontSize={12} />
                    <Tooltip contentStyle={tooltipStyle} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                    <Line type="monotone" dataKey="lph" name="LPH real" stroke="#10b981" strokeWidth={3} dot={{ r: 3 }} />
                    <Line type="monotone" dataKey="obj" name="Objetivo" stroke="#ef4444" strokeDasharray="6 4" dot={false} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </Card>
          </div>

          <Card>
            <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="barchart" size={18} className="text-sky-400" /> Catálogo completo de KPIs</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left text-slate-400 border-b border-slate-800">
                    <th className="py-2 pr-4">Categoría</th><th className="py-2 pr-4">KPI</th>
                    <th className="py-2 pr-4">Fórmula</th><th className="py-2 pr-4">Objetivo</th>
                    <th className="py-2 pr-4">Actual</th><th className="py-2">Estado</th>
                  </tr>
                </thead>
                <tbody>
                  {KPI_TABLE.map(function (k, i) {
                    return (
                      <tr key={i} className="border-b border-slate-800/60 text-slate-200">
                        <td className="py-2.5 pr-4"><Badge tone="slate">{k.cat}</Badge></td>
                        <td className="py-2.5 pr-4 font-semibold">{k.kpi}</td>
                        <td className="py-2.5 pr-4 font-mono text-xs text-slate-400">{k.formula}</td>
                        <td className="py-2.5 pr-4">{k.target}</td>
                        <td className="py-2.5 pr-4 font-bold text-white">{k.value}</td>
                        <td className="py-2.5"><Badge tone={stTone(k.st)}>{k.st === 'ok' ? 'Óptimo' : k.st === 'warn' ? 'Atención' : 'Crítico'}</Badge></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      );
    }

    /* ============ INCIDENCIAS ============ */
    function Incidents() {
      var s1 = useState([
        { id: 'INC-341', tipo: 'Rotura de stock', loc: 'B-04-07', sev: 'Alta', estado: 'Abierta', who: 'M. Torres' },
        { id: 'INC-340', tipo: 'Ubicación incorrecta', loc: 'C-08-02', sev: 'Media', estado: 'En revisión', who: 'J. Ruiz' },
        { id: 'INC-338', tipo: 'Producto dañado', loc: 'A-12-03', sev: 'Media', estado: 'Resuelta', who: 'L. García' },
        { id: 'INC-336', tipo: 'Equipo averiado', loc: 'Transpaletar TP-09', sev: 'Alta', estado: 'Resuelta', who: 'Mantenimiento' }
      ]), list = s1[0], setList = s1[1];

      function report(tipo) {
        setList([{ id: 'INC-' + (342 + list.length), tipo: tipo, loc: TASKS[list.length % TASKS.length].loc, sev: 'Alta', estado: 'Abierta', who: 'Operario actual' }].concat(list));
      }
      function resolve(id) {
        setList(list.map(function (i) { return i.id === id ? { id: i.id, tipo: i.tipo, loc: i.loc, sev: i.sev, estado: 'Resuelta', who: i.who } : i; }));
      }

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <StatCard icon="alert" label="Incidencias abiertas" value={String(list.filter(function (i) { return i.estado !== 'Resuelta'; }).length)} sub="sin bloqueo del flujo" tone="red" />
            <StatCard icon="timer" label="MTTR" value="7 min" sub="objetivo ≤ 10 min" tone="emerald" />
            <StatCard icon="activity" label="Tasa incidencia" value="3,2 ‰" sub="por 1.000 líneas" tone="sky" />
          </div>
          <Card>
            <h3 className="text-white font-semibold mb-3">Reporte rápido desde terminal del operario</h3>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              {['Rotura de stock', 'Producto dañado', 'Ubicación incorrecta', 'Equipo averiado'].map(function (t) {
                return (
                  <button key={t} onClick={function () { report(t); }} className="py-4 rounded-xl bg-red-500/10 border border-red-500/40 text-red-300 font-bold hover:bg-red-500/20 flex items-center justify-center gap-2">
                    <Icon name="plus" size={16} /> {t}
                  </button>
                );
              })}
            </div>
            <div className="space-y-3">
              {list.map(function (i) {
                return (
                  <div key={i.id} className="flex flex-wrap items-center gap-3 bg-slate-800/60 border border-slate-700 rounded-xl p-4">
                    <span className="font-mono text-sky-400 font-bold w-20">{i.id}</span>
                    <Badge tone={i.sev === 'Alta' ? 'red' : 'amber'}>{i.sev}</Badge>
                    <span className="text-white font-semibold flex-1 min-w-max">{i.tipo}</span>
                    <span className="text-slate-400 text-sm flex items-center gap-1"><Icon name="pin" size={13} /> {i.loc}</span>
                    <span className="text-slate-500 text-sm">{i.who}</span>
                    <Badge tone={i.estado === 'Resuelta' ? 'emerald' : 'amber'}>{i.estado}</Badge>
                    {i.estado !== 'Resuelta' && (
                      <button onClick={function () { resolve(i.id); }} className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold">Resolver</button>
                    )}
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      );
    }

    /* ============ INTEGRACIONES ============ */
    function Integrations(props) {
      var online = props.online, pending = props.pending;
      var conns = [
        { name: 'WMS Manhattan', status: online ? 'Bidireccional · OK' : 'Cola local activa', lat: '42 ms', tone: online ? 'emerald' : 'amber', icon: 'database' },
        { name: 'ERP SAP S/4HANA', status: online ? 'Stock sincronizado' : 'Pendiente de reintentar', lat: '88 ms', tone: online ? 'emerald' : 'amber', icon: 'boxes' },
        { name: 'Voice-Picking (Vocolo)', status: 'Activo · latencia 120 ms', lat: '120 ms', tone: 'emerald', icon: 'volume' },
        { name: 'Pick-to-Light (pasillo 3)', status: 'Activo · 24 luces', lat: '8 ms', tone: 'emerald', icon: 'zap' },
        { name: 'Anillos escáner Zebra RS6000', status: '4 conectados vía BLE', lat: '—', tone: 'sky', icon: 'scan' },
        { name: 'Transporte / TMS', status: 'Órdenes de carga emitidas', lat: '95 ms', tone: 'emerald', icon: 'truck' }
      ];
      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <StatCard icon={online ? 'wifi' : 'wifioff'} label="Estado de conexión" value={online ? 'ONLINE' : 'OFFLINE'} sub={online ? 'Sincronización en caliente' : 'Cola local: ' + pending + ' operaciones'} tone={online ? 'emerald' : 'amber'} />
            <StatCard icon="refresh" label="Operaciones en cola" value={String(pending)} sub="se sincronizan al recuperar red" tone={pending > 0 ? 'amber' : 'emerald'} />
            <StatCard icon="shield" label="Integridad de datos" value="100%" sub="transacciones idempotentes + checksum" tone="emerald" />
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card>
              <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="plug" size={18} className="text-sky-400" /> Conectores API (bidireccionales)</h3>
              <div className="space-y-3">
                {conns.map(function (c) {
                  return (
                    <div key={c.name} className="flex items-center gap-3 bg-slate-800/60 border border-slate-700 rounded-xl p-3">
                      <div className={'p-2 rounded-lg ' + toneMap[c.tone]}><Icon name={c.icon} size={16} /></div>
                      <div className="flex-1">
                        <div className="text-white font-semibold text-sm">{c.name}</div>
                        <div className="text-xs text-slate-400">{c.status}</div>
                      </div>
                      <span className="text-xs font-mono text-slate-500">{c.lat}</span>
                      <span className={'w-2.5 h-2.5 rounded-full ' + (online || c.tone === 'emerald' ? 'bg-emerald-400' : 'bg-amber-400') + ' animate-pulse'} />
                    </div>
                  );
                })}
              </div>
            </Card>
            <div className="space-y-6">
              <Card>
                <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><Icon name="activity" size={18} className="text-emerald-400" /> Latencia de API (ms)</h3>
                <div className="h-48">
                  <ResponsiveContainer>
                    <LineChart data={LATENCY}>
                      <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" />
                      <XAxis dataKey="t" stroke="#64748b" fontSize={11} />
                      <YAxis stroke="#64748b" fontSize={11} />
                      <Tooltip contentStyle={tooltipStyle} />
                      <Legend wrapperStyle={{ fontSize: 12 }} />
                      <Line type="monotone" dataKey="wms" name="WMS" stroke="#10b981" strokeWidth={2} dot={false} />
                      <Line type="monotone" dataKey="erp" name="ERP" stroke="#0ea5e9" strokeWidth={2} dot={false} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              </Card>
              <Card>
                <h3 className="text-white font-semibold mb-3 flex items-center gap-2"><Icon name="cpu" size={18} className="text-amber-400" /> Arquitectura escalable</h3>
                <div className="flex flex-wrap gap-2">
                  {['API Gateway', 'Autoscaling K8s', 'Redis (caché en caliente)', 'PostgreSQL + particionado', 'Cola offline SQLite (PWA)', 'Edge sync con CRDT', 'JWT + OAuth2', 'Offline-first · 0 latencia local'].map(function (b) {
                    return <span key={b} className="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300">{b}</span>;
                  })}
                </div>
                <p className="text-xs text-slate-500 mt-3">Diseñado para picos tipo Black Friday/Navidad: colas de eventos + reintentos exponenciales + sincronización diferencial al reconectar.</p>
              </Card>
            </div>
          </div>
        </div>
      );
    }

    /* ============ APP PRINCIPAL ============ */
    function App() {
      var s1 = useState('dash'), view = s1[0], setView = s1[1];
      var s2 = useState(true), online = s2[0], setOnline = s2[1];
      var s3 = useState(false), syncing = s3[0], setSyncing = s3[1];
      var s4 = useState(0), pending = s4[0], setPending = s4[1];
      var s5 = useState(null), toast = s5[0], setToast = s5[1];

      useEffect(function () {
        if (online && pending > 0) {
          setSyncing(true);
          var t = setTimeout(function () {
            setSyncing(false); setPending(0);
            setToast('Sincronización completada con WMS/ERP ✓');
            setTimeout(function () { setToast(null); }, 2600);
          }, 1800);
          return function () { clearTimeout(t); };
        }
      }, [online, pending]);

      var navItem = NAV.find(function (n) { return n.id === view; });

      return (
        <div className="min-h-screen bg-slate-950 text-slate-200 flex">
          <aside className="w-64 hidden lg:flex flex-col border-r border-slate-800 bg-slate-900/50 p-4">
            <div className="flex items-center gap-3 mb-6 px-2">
              <svg viewBox="0 0 64 64" className="w-11 h-11 shrink-0">
                <rect width="64" height="64" rx="14" fill="#022c22" stroke="#059669" strokeWidth="2" />
                <polyline points="12,50 12,20 30,20 30,42 46,42 46,14" fill="none" stroke="#34d399" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                <circle cx="12" cy="50" r="4" fill="#f59e0b" />
                <circle cx="46" cy="14" r="4" fill="#10b981" />
              </svg>
              <div>
                <div className="text-white font-black text-lg leading-tight">TRAZA<span className="text-emerald-400">//CO2</span></div>
                <div className="text-xs text-slate-500">Eficiencia en Picking · v2.1</div>
              </div>
            </div>
            <nav className="space-y-1 flex-1 overflow-y-auto">
              {NAV.map(function (n) {
                return (
                  <button key={n.id} onClick={function () { setView(n.id); }}
                    className={'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all ' + (view === n.id ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'text-slate-400 hover:bg-slate-800 hover:text-white')}>
                    <Icon name={n.icon} size={18} /> {n.label}
                  </button>
                );
              })}
            </nav>
            <div className="text-xs text-slate-600 px-2 space-y-1 pt-4 border-t border-slate-800">
              <div className="flex items-center gap-2"><Icon name="warehouse" size={12} /> Almacén MAD-01 · Turno mañana</div>
              <div className="flex items-center gap-2"><Icon name="clock" size={12} /> Actualizado 10:34</div>
              <div className="text-slate-500 font-semibold pt-1">© 2026 Miguel Ángel Layunta López</div>
            </div>
          </aside>

          <main className="flex-1 flex flex-col min-w-0">
            <header className="flex items-center justify-between border-b border-slate-800 bg-slate-900/60 px-6 py-4">
              <div className="flex items-center gap-3 min-w-0">
                <Icon name={navItem.icon} size={22} className="text-emerald-400 shrink-0" />
                <h1 className="text-xl font-bold text-white truncate">{navItem.label}</h1>
                <span className="hidden md:inline text-xs text-slate-500 font-semibold">TRAZA//CO2 · M.Á. Layunta López</span>
              </div>
              <div className="flex items-center gap-3">
                {syncing && <span className="flex items-center gap-2 text-sky-400 text-sm font-semibold"><Icon name="refresh" size={16} className="animate-spin" /> Sincronizando…</span>}
                {pending > 0 && !syncing && <Badge tone="amber"><Icon name="send" size={12} /> {pending} en cola</Badge>}
                <button onClick={function () { setOnline(!online); }}
                  className={'flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-sm border transition-all ' + (online ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40 hover:bg-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/40 hover:bg-amber-500/20')}>
                  <Icon name={online ? 'wifi' : 'wifioff'} size={16} /> {online ? 'ONLINE' : 'OFFLINE'}
                </button>
              </div>
            </header>

            <div className="flex gap-2 p-4 lg:hidden overflow-x-auto">
              {NAV.map(function (n) {
                return (
                  <button key={n.id} onClick={function () { setView(n.id); }} className={'px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap ' + (view === n.id ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300')}>{n.label}</button>
                );
              })}
            </div>

            <div className="p-6 flex-1 overflow-auto">
              {view === 'dash' && <Dashboard />}
              {view === 'op' && <Operario online={online} onLineDone={function () { setPending(function (p) { return p + 1; }); }} />}
              {view === 'routes' && <RoutesView />}
              {view === 'sim' && <CampaignSim />}
              {view === 'waves' && <WavePlanner />}
              {view === 'train' && <Induction />}
              {view === 'kpis' && <KPIs />}
              {view === 'inc' && <Incidents />}
              {view === 'int' && <Integrations online={online} pending={pending} />}
            </div>
          </main>

          {toast && (
            <div className="fixed bottom-6 right-6 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-2">
              <Icon name="check" size={18} /> {toast}
            </div>
          )}
        </div>
      );
    }

    var el = document.getElementById('root');
    if (ReactDOM.createRoot) { ReactDOM.createRoot(el).render(<App />); }
    else { ReactDOM.render(<App />, el); }
  </script>
</body>
</html>
